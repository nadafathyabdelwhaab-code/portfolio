<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nada Ayman | Content Creator</title>
<meta name="description" content="Nada Ayman, content creator: content strategy, reel ideas, scripts and captions for food, wellness and café brands.">
<meta name="theme-color" content="#2A0B1F">
<meta property="og:type" content="website">
<meta property="og:title" content="Nada Ayman | Content Creator">
<meta property="og:description" content="Content that makes the product clear, and gets remembered.">
<link rel="alternate" hreflang="ar" href="https://nadafathyabdelwhaab-code.github.io/portfolio/creator/">
<link rel="alternate" hreflang="en" href="https://nadafathyabdelwhaab-code.github.io/portfolio/creator/en/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A0B1F'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='30' fill='%23FF4F9A' font-family='serif'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=El+Messiri:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<a class="skip" href="#main" data-t="skip"></a>
<header class="nav">
  <div class="wrap">
    <a class="name" href="#top" id="navName"></a>
    <nav>
      <a href="#about" data-t="navAbout"></a><a href="#services" data-t="navServices"></a><a href="#clients" data-t="navWork"></a><a href="#samples" data-t="navSamples"></a><a href="#contact" data-t="navContact"></a>
    </nav>
    <div class="nav-r">
      <a class="lang" id="langSw" hreflang="ar"></a>
      <a class="btn btn-pink btn-sm" id="navWa" target="_blank" rel="noopener" data-t="wa"></a>
    </div>
  </div>
</header>

<main id="main">
<section class="hero" id="top">
  <div class="wrap hero-grid">
    <div>
      <p class="role" id="role"></p>
      <h1 id="h1"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="intro" id="intro"></p>
      <div class="cta-row">
        <a class="btn btn-pink" id="heroWa" target="_blank" rel="noopener" data-t="heroCta1"></a>
        <a class="btn btn-ghost" href="#clients" data-t="heroCta2"></a>
      </div>
    </div>
    <div class="card-hero">
      <div class="top"><span><i class="dot"></i><span data-t="heroCardTitle"></span></span><span>CONTENT</span></div>
      <ul id="heroList"></ul>
    </div>
  </div>
</section>

<div class="stats" id="statsBand" hidden><div class="wrap" id="stats"></div></div>

<section id="about">
  <div class="wrap about-grid">
    <div>
      <p class="eyebrow" data-t="aboutEyebrow"></p>
      <h2 data-t="aboutTitle"></h2>
      <div id="aboutText"></div>
      <div class="split" id="split"></div>
      <ul class="strengths" id="strengths"></ul>
    </div>
    <ul class="profile" id="profile"></ul>
  </div>
</section>

<section class="band-blush" id="services">
  <div class="wrap">
    <p class="eyebrow" data-t="servicesEyebrow"></p>
    <h2 data-t="servicesTitle"></h2>
    <div class="svc" id="svc"></div>
  </div>
</section>

<section class="band-dark" id="process">
  <div class="wrap">
    <p class="eyebrow" data-t="processEyebrow"></p>
    <h2 data-t="processTitle"></h2>
    <div class="steps" id="steps"></div>
  </div>
</section>

<section id="clients">
  <div class="wrap">
    <p class="eyebrow" data-t="workEyebrow"></p>
    <h2 data-t="workTitle"></h2>
    <p class="lead" data-t="workLead"></p>
    <div class="clients" id="clientList"></div>
  </div>
</section>

<section class="band-blush" id="samples">
  <div class="wrap">
    <p class="eyebrow" data-t="samplesEyebrow"></p>
    <h2 data-t="samplesTitle"></h2>
    <p class="lead" data-t="samplesLead"></p>
    <div id="sampleList"></div>
  </div>
</section>

<section class="band-dark" id="contact">
  <div class="wrap contact-grid">
    <div>
      <p class="eyebrow" data-t="contactEyebrow"></p>
      <h2 data-t="contactTitle"></h2>
      <p class="lead" data-t="contactLead"></p>
      <ul class="cinfo" id="cinfo"></ul>
    </div>
    <div class="cta-box">
      <h3 data-t="ctaTitle"></h3>
      <p data-t="ctaText"></p>
      <div class="cta-row">
        <a class="btn btn-pink" id="ctaWa" target="_blank" rel="noopener" data-t="wa"></a>
        <a class="btn btn-ghost" id="ctaMail" style="color:var(--on-dark);border-color:var(--line-dark)" data-t="email"></a>
      </div>
    </div>
  </div>
</section>
</main>

<footer><div class="wrap"><span id="copy"></span><span id="asof"></span></div></footer>

<script src="../data.en.js"></script>
<script src="../app.js"></script>
</body>
</html>
